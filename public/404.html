<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#201d1a" />
    <title>Página não encontrada — SIOPPER</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: #fff; background: #201d1a; font-family: Arial, sans-serif; text-align: center; }
      main { max-width: 540px; }
      .brand { display: block; width: 92px; height: 92px; border: 2px solid #d6a168; border-radius: 50%; object-fit: contain; background: #fff; }
      .code { margin: 36px 0 4px; color: #d6a168; font-size: 13px; letter-spacing: .2em; }
      h1 { margin: 0 0 15px; font-size: clamp(32px, 7vw, 50px); letter-spacing: -.05em; }
      p { color: #c8c1b9; line-height: 1.7; }
      a { display: inline-flex; min-height: 50px; align-items: center; margin-top: 20px; padding: 0 20px; color: #201d1a; background: #d6a168; font-size: 13px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="/images/siopper-logo.jpg" alt="Logótipo SIOPPER" />
      <p class="code">ERRO 404</p>
      <h1>Esta página não foi encontrada.</h1>
      <p>O endereço pode estar incorrecto ou a página já não estar disponível.</p>
      <a href="/">Voltar à página inicial</a>
    </main>
  </body>
</html>
